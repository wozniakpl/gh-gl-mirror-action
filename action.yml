# Reusable action: mirror GitHub repos to GitLab
# Repo: gh-gl-mirror-action (public); use as: owner/gh-gl-mirror-action@main
name: 'Mirror GitHub to GitLab'
description: 'Lists your GitHub repos and mirrors them to GitLab (creates projects if needed).'
inputs:
  gh_pat:
    description: 'GitHub PAT (classic: repo scope, or fine-grained: Contents + Metadata read)'
    required: true
  gl_pat:
    description: 'GitLab PAT (api or read_repository + write_repository)'
    required: true
  gitlab_user:
    description: 'GitLab username (e.g. gitlab.com/this-username/...)'
    required: true
  visibility:
    description: 'Visibility for new GitLab projects: public, private, internal, or keep (preserve source visibility)'
    required: true
    default: 'private'
  repository_owner:
    description: 'GitHub org/user whose repos to mirror'
    required: true
  skip_repos:
    description: 'Comma-separated repo names to exclude from mirror list (e.g. this orchestrator repo)'
    required: false
    default: ''
  skip_failed_repos:
    description: 'If true, continue with next repo when mirroring one fails instead of failing the job'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Mirror GitHub repos to GitLab
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_pat }}
        GL_PAT: ${{ inputs.gl_pat }}
        GITLAB_USER: ${{ inputs.gitlab_user }}
        VISIBILITY: ${{ inputs.visibility }}
        REPO_OWNER: ${{ inputs.repository_owner }}
        SKIP_REPOS: ${{ inputs.skip_repos }}
        SKIP_FAILED_REPOS: ${{ inputs.skip_failed_repos }}
      run: |
        set -e
        # Fetch all repos using gh repo list with high limit (handles pagination internally)
        # Using --limit 10000 to ensure we get all repos even for large organizations
        REPOS=$(gh repo list "$REPO_OWNER" --limit 10000 --json name -q '.[].name' | sort -u)
        echo "=========================================="
        echo "Repos found ($(echo "$REPOS" | wc -l)):"
        echo "$REPOS" | while read -r r; do echo "  - $r"; done
        echo "=========================================="
        for REPO in $REPOS; do
          if [ -n "$SKIP_REPOS" ]; then
            SKIP_LIST=",$(echo "$SKIP_REPOS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | paste -sd, -),"
            case "$SKIP_LIST" in (*",$REPO,"*) echo "Skipping $REPO (excluded)"; continue ;; esac
          fi
          echo "------------------------------------------"
          echo "Processing: $REPO"
          EFFECTIVE_VISIBILITY="$VISIBILITY"
          if [ "$VISIBILITY" = "keep" ]; then
            GH_VISIBILITY=$(gh repo view "$REPO_OWNER/$REPO" --json visibility -q '.visibility' 2>/dev/null || echo "private")
            GH_VISIBILITY=$(echo "$GH_VISIBILITY" | tr '[:upper:]' '[:lower:]')
            case "$GH_VISIBILITY" in
              public) EFFECTIVE_VISIBILITY="public" ;;
              internal) EFFECTIVE_VISIBILITY="internal" ;;
              *) EFFECTIVE_VISIBILITY="private" ;;
            esac
            echo "Source visibility: $GH_VISIBILITY -> GitLab visibility: $EFFECTIVE_VISIBILITY"
          fi
          curl --header "PRIVATE-TOKEN: $GL_PAT" \
               -X POST "https://gitlab.com/api/v4/projects?name=$REPO&visibility=$EFFECTIVE_VISIBILITY" \
               -s -o /dev/null || echo "Project creation skipped (likely already exists)."
          mirror_repo() {
            git clone --mirror "https://x-access-token:$GH_TOKEN@github.com/$REPO_OWNER/$REPO.git" "$REPO-tmp"
            pushd "$REPO-tmp"
            git push --mirror "https://oauth2:$GL_PAT@gitlab.com/$GITLAB_USER/$REPO.git"
            popd
            rm -rf "$REPO-tmp"
          }
          if [ "$SKIP_FAILED_REPOS" = "true" ]; then
            if ! ( mirror_repo ); then
              echo "Failed to mirror $REPO, skipping"
              rm -rf "$REPO-tmp"
              continue
            fi
          else
            mirror_repo
          fi
          echo "Finished syncing $REPO"
        done
